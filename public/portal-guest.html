<style>
:root{--flame:#F0562E;--grape:#4C2A86;--gold:#F5A623;--ink:#1A1230;--cream:#FFF8F0;--green:#1F9D6B;--muted:#6B6480;--line:#E4D9F5;--accent:#1F9D6B;--plum:#3A2B5C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
a{color:var(--flame);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.nav{background:#fff;border-bottom:1px solid #eee;position:relative;z-index:20}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:27px;letter-spacing:-.5px;color:var(--flame);flex-shrink:0}
.logo img{width:48px;height:48px;border-radius:11px;object-fit:cover}
.logo b{color:var(--grape)}
.logo .wordmark{white-space:nowrap}
.nav-links{display:flex;flex-wrap:nowrap;white-space:nowrap;gap:20px;font-weight:600;font-size:15px;color:var(--plum)}
.nav-links a{color:inherit}
.nav-links a:hover{color:var(--flame)}
.nav-right{display:flex;align-items:center;gap:12px}
.lang a{font-weight:800;font-size:13px;color:var(--muted);cursor:pointer}
.lang a.on{color:var(--flame)}
.hamb{display:none;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--grape)}
@media(max-width:900px){
  .hamb{display:block}
  .nav-links{position:absolute;top:100%;left:0;right:0;background:var(--cream);flex-direction:column;gap:0;padding:6px 22px 14px;border-bottom:1px solid var(--line);display:none}
  .nav-links.open{display:flex}
  .nav-links a{padding:13px 2px;border-bottom:1px solid var(--line);font-size:16px}
  .nav-links a:last-child{border-bottom:0}
}
@media(max-width:640px){.logo{font-size:23px;gap:9px}.logo img{width:48px;height:48px}}

.hero p{color:#e2d8ff;margin-top:6px;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 6px 24px rgba(26,18,48,.06)}
.login{max-width:430px;margin:-34px auto 40px;position:relative}
.login h2{font-size:20px;margin-bottom:4px}
.login p.sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font:inherit;font-size:15px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,86,46,.12)}
.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:800;border:0;border-radius:11px;padding:13px 22px;font-size:15px;cursor:pointer;width:100%;margin-top:16px;font-family:inherit}
.btn:disabled{opacity:.6}
.err{display:none;background:#FDECEA;color:#B3261E;border-radius:10px;padding:10px 13px;font-size:13.5px;margin-top:12px;font-weight:600}
.err.show{display:block}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.dash{display:none;padding:26px 0 50px}
h3.sec{font-size:17px;margin:26px 0 10px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13.5px}
th{background:var(--grape);color:#fff;text-align:left;padding:9px 12px;font-size:12px}
td{padding:9px 12px;border-bottom:1px solid #f0ecf7;vertical-align:middle}
tr:nth-child(even) td{background:#faf8fd}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800}
.pill.in{background:#EAF7F1;color:var(--green)}
.tix{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tik{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.tik .img{width:100%;height:140px;object-fit:cover;display:block;background:linear-gradient(135deg,var(--grape),var(--flame))}
.tik .bd{padding:14px 16px 16px}
.tik .ev{font-weight:800;font-size:15px;color:var(--grape)}
.tik .meta{color:var(--muted);font-size:12.5px;margin:6px 0 10px;line-height:1.55}
.qr{display:inline-block;background:var(--ink);color:#fff;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer;border:0;font-family:inherit}
.qr.get{background:var(--flame)}
.qr.act{background:var(--grape);margin-left:6px;margin-top:6px}
.qrbox{display:none;text-align:center;padding:12px;background:#faf8fd;border-radius:11px;margin-top:10px}
.qrbox.show{display:block}
.qrbox .qrimg{display:inline-block;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
.qrbox .code{font-weight:800;font-size:13px;margin-top:8px;letter-spacing:1px}
.qrbox .note{font-size:11.5px;color:var(--muted);margin-top:4px}
.subscribe{background:linear-gradient(135deg,var(--grape),#2c1a52);border-radius:16px;color:#fff;padding:26px 24px;margin-top:30px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.subscribe .tt{font-size:18px;font-weight:800}
.subscribe .ss{color:#e2d8ff;font-size:13.5px;margin-top:4px;line-height:1.5}
.subscribe form{display:flex;gap:8px;flex-wrap:wrap}
.subscribe input{max-width:250px;border:0}
.subscribe .btn{width:auto;margin-top:0;background:var(--gold);color:var(--ink)}
.subscribe .ig{color:#ffd9a8;font-weight:700;font-size:12.5px}
.invite{margin-top:10px;font-size:12.5px;color:var(--muted)}
.shb{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;margin:0 2px;font-size:14px;cursor:pointer;text-decoration:none;line-height:1}
.shb:hover{border-color:var(--flame)}
.logout{background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:22px;line-height:1.6}
.spin{display:none;text-align:center;padding:40px;color:var(--muted);font-weight:700}
@media(max-width:640px){.hero h1{font-size:23px}.login{margin-top:-20px}}

.hero{background:linear-gradient(135deg,var(--grape),#2c1a52);position:relative;overflow:hidden;color:#fff;padding:40px 0}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 46px)}
.hero .wrap{position:relative}
.hero h1{font-size:32px;letter-spacing:-.6px}
.stat{background:linear-gradient(160deg,#fff,#FBF7FF);border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:0 4px 16px rgba(76,42,134,.07)}
.stat .v{font-size:23px}
.card{border-radius:18px;box-shadow:0 10px 34px rgba(26,18,48,.09)}
h3.sec{font-size:18px;margin:30px 0 12px;color:var(--grape);letter-spacing:-.2px}
table{box-shadow:0 4px 18px rgba(26,18,48,.05)}
.shb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:9px;margin:0 2px;cursor:pointer;text-decoration:none;vertical-align:middle;transition:.12s}
.shb:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(26,18,48,.14)}
.shb svg{width:16px;height:16px}

/* ===== v60: mobile safety — comfortable gutters, real tap targets, no iOS zoom ===== */
html{overflow-x:clip}
body{overflow-x:clip;max-width:100%}
@media(max-width:900px){
  .wrap,.dash,.login,.auth,.sec,.tix,.subscribe,.card,.panel,.box,.form,.reg,.hero-in,.phead .wrap{
    padding-left:max(20px,env(safe-area-inset-left))!important;
    padding-right:max(20px,env(safe-area-inset-right))!important;
    max-width:100%!important}
  .nav-in{min-width:0;gap:8px}
  .logo{min-width:0;flex-shrink:1;overflow:hidden}
  .logo .wordmark{overflow:hidden;text-overflow:clip;min-width:0}
  .wordmark{font-size:clamp(13px,4.35vw,24px)!important;letter-spacing:-.4px!important}
  .nav-right{min-width:0;flex-shrink:0;gap:6px}
  .hamb{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;flex-shrink:0}
  /* 16px inputs stop iOS zooming the page on focus */
  input,select,textarea{font-size:16px!important}
  input:not([type=checkbox]):not([type=radio]),select,textarea{min-height:48px}
  button,.btn,a.btn{min-height:46px}
  /* EN / FR toggle was 16x14 - unusable. Give it a real hit area. */
  .lang a{display:inline-block;min-width:34px;min-height:34px;line-height:34px;text-align:center}
  table{display:block;overflow-x:auto;max-width:100%}
  pre,code{white-space:pre-wrap;word-break:break-word}
  a{word-break:break-word}
}
@media(max-width:420px){
  .wrap,.dash,.login,.auth,.sec,.tix,.subscribe,.card,.panel,.box,.form,.reg{
    padding-left:20px!important;padding-right:20px!important}
}


/* ===== v60.1: measured follow-ups =====
   1. Cards spanned edge-to-edge (L0) on the portals — padded inside, but with no
      air around them. Inset the card itself so the margin is visible.
   2. A 15px input survived the blanket rule (beaten on specificity), so it is
      enforced in JS below as well. */
@media(max-width:900px){
  .login,.auth,.reg,.dash,.tix,.subscribe{
    margin-left:auto!important;margin-right:auto!important;
    width:calc(100% - 40px)!important;max-width:calc(100% - 40px)!important;box-sizing:border-box}
  .login.card,.auth > .card,.reg > .card{border-radius:16px!important}
}
@media(max-width:420px){
  .login,.auth,.reg,.dash,.tix,.subscribe{
    width:calc(100% - 40px)!important;max-width:calc(100% - 40px)!important}
}


/* v64: Follow-us row — identical to the main site footer */
.psoc{display:grid;grid-template-columns:repeat(3,44px);justify-content:center;gap:14px;margin:0 auto 14px}
.psoc a{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.psoc a svg{width:21px;height:21px;fill:#fff;display:block}
.psoc .fb{background:#1877F2}
.psoc .ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.psoc .wa{background:#25D366}

/* v65: wordmark fits at every width — no half-words in the portal header */
@media(max-width:430px){ .logo img{width:34px!important;height:34px!important} }
@media(max-width:400px){ .wordmark{letter-spacing:-.55px!important} }
@media(max-width:349px){ .logo .wordmark{display:none} .logo img{width:38px!important;height:38px!important} }

function setLang(l){L=l;localStorage.setItem("plang",l);applyLang();if(D)render(D);}
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(function(n){var k=n.getAttribute("data-i18n");if(I18N[L][k])n.textContent=I18N[L][k];});
 document.querySelectorAll(".lang a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-l")===L);});}
async function lookup(ev){
  ev.preventDefault();
  var b=document.getElementById("gbtn");b.disabled=true;
  document.getElementById("gerr").classList.remove("show");
  try{
    var r=await fetch(API+"/portal/guest",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("gm").value})});
    var d=await r.json();
    if(d && (d.tickets||[]).length + (d.orders||[]).length > 0){D=d;show();}
    else{document.getElementById("gerr").classList.add("show");b.disabled=false;}
  }catch(e){document.getElementById("gerr").classList.add("show");b.disabled=false;}
  return false;
}
function show(){
  document.getElementById("lookupBox").style.display="none";
  document.getElementById("dash").style.display="block";
  render(D); loadUpcoming();
  var se=document.getElementById("subEmail"); if(se&&D&&D.email)se.value=D.email;
}
function render(d){
  applyLang();
  document.getElementById("who").textContent=d.name||"My tickets";
  document.getElementById("whoEmail").textContent=d.email;
  document.getElementById("tix").innerHTML=(d.tickets||[]).map(function(t,i){
    var code=t.code||t.ticket_no||("PLG"+i);
    return '<div class="tik">'+(t.image?('<img class="img" src="'+t.image+'" alt="" loading="lazy">'):'<div class="img"></div>')
      +'<div class="bd"><div class="ev">'+t.event+'</div>'
      +'<div class="meta">🗓️ '+(t.date||"")+(t.time?(" · "+t.time):"")+'<br>📍 '+(t.venue||"")
      +'<br>🎫 '+(t.type||"Ticket")+(t.ticket_no?(' · #'+t.ticket_no):'')+'</div>'
      +(t.checked_in?'<span class="pill in" style="margin-right:8px">'+I18N[L].checked+'</span>':'')
      +'<button class="qr" onclick="toggleQR('+i+',this)">📱 '+I18N[L].showQR+'</button>'
      +'<button class="qr act" onclick="emailTicket('+i+',this)" title="'+I18N[L].emailTix+'">✉️ '+I18N[L].emailTix+'</button>'
      +'<button class="qr act" onclick="printTicket('+i+')" title="'+I18N[L].printTix+'">🖨️ '+I18N[L].printTix+'</button>'
      +'<div class="qrbox" id="qrb'+i+'"><div class="qrimg" id="qri'+i+'"></div>'
      +'<div class="code">'+code+'</div><div class="note">'+I18N[L].qrNote+'</div></div>'
      +'<div class="invite"><b>'+I18N[L].invite+'</b> '+shareRow(t)+'</div>'
      +'</div></div>';}).join("")
    ||'<p style="color:var(--muted)">—</p>';
  document.getElementById("ordT").innerHTML="<tr><th>#</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr>"
    +(d.orders||[]).map(function(o){return "<tr><td>#"+o.no+"</td><td>"+o.date+"</td><td>"+o.items+"</td><td>"+o.total+"</td><td>"+o.status+"</td></tr>";}).join("");
}
function toggleQR(i,btn){
  var box=document.getElementById("qrb"+i);
  var on=box.classList.toggle("show");
  btn.textContent=on?("📱 "+I18N[L].hideQR):("📱 "+I18N[L].showQR);
  var holder=document.getElementById("qri"+i);
  if(on&&!holder.hasChildNodes()){
    var t=(D.tickets||[])[i]||{};
    var code=t.code||t.ticket_no||("PLG"+i);
    new QRCode(holder,{text:"PLUGSVC:"+code,width:150,height:150,colorDark:"#1A1230",colorLight:"#ffffff"});
  }
}
function makeQRData(code,cb){
  var tmp=document.createElement("div");tmp.style.cssText="position:absolute;left:-9999px";document.body.appendChild(tmp);
  new QRCode(tmp,{text:"PLUGSVC:"+code,width:220,height:220,colorDark:"#1A1230",colorLight:"#ffffff"});
  setTimeout(function(){
    var img=tmp.querySelector("img"),cv=tmp.querySelector("canvas");
    var data=(img&&img.src)?img.src:(cv?cv.toDataURL("image/png"):"");
    document.body.removeChild(tmp);cb(data);
  },200);
}
function printTicket(i){
  var t=(D.tickets||[])[i]||{};
  var code=t.code||t.ticket_no||("PLG"+i);
  makeQRData(code,function(qr){
    var w=window.open("","_blank","width=440,height=680");
    if(!w){return;}
    var LOGO="https://tickets.plugservices.ca/wp-content/uploads/2024/04/cropped-PHOTO-2024-04-03-10-37-57_1-270x270.jpg";
    w.document.write('<!DOCTYPE html><html><head><title>PlugServices Ticket — '+(t.event||"")+'</title>'
      +'<style>body{font-family:Arial,sans-serif;margin:0;padding:24px;color:#1A1230}'
      +'.tk{max-width:380px;margin:0 auto;border:2px solid #4C2A86;border-radius:16px;overflow:hidden}'
      +'.hd{background:#4C2A86;color:#fff;padding:12px 18px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}'
      +'.hd img{width:34px;height:34px;border-radius:8px;display:block}.hd span{color:#F5A623}.hd small{margin-left:auto;font-size:10px;letter-spacing:1px;font-weight:800;color:#E4D9F5}'
      +'.evimg{width:100%;height:130px;object-fit:cover;display:block}'
      +'.bd{padding:18px}.ev{font-size:19px;font-weight:800;color:#4C2A86;margin:0 0 8px}'
      +'.mt{font-size:13.5px;line-height:1.8;color:#333}.qrw{text-align:center;margin:16px 0 6px}'
      +'.qrw img{width:220px;height:220px;border:1px solid #ddd;border-radius:10px;padding:8px}'
      +'.cd{text-align:center;font-weight:800;letter-spacing:2px;font-size:15px;margin:6px 0 2px}'
      +'.nt{text-align:center;font-size:11px;color:#777;margin-bottom:8px}'
      +'.ft{background:#FFF8F0;padding:10px 18px;font-size:11px;color:#6B6480;text-align:center}'
      +'@media print{body{padding:0}.tk{border-width:1.5px}}'
      +'</style></head><body>'
      +'<div class="tk"><div class="hd"><img src="'+LOGO+'" alt="PlugServices logo">Plug<span>Services</span><small>E-TICKET</small></div>'
      +(t.image?('<img class="evimg" src="'+t.image+'" alt="'+(t.event||"Event")+'">'):'')
      +'<div class="bd">'
      +'<div class="ev">'+(t.event||"")+'</div>'
      +'<div class="mt">👤 <b>'+(t.attendee||"")+'</b><br>🎫 '+(t.type||"Ticket")+(t.ticket_no?(' · #'+t.ticket_no):'')
      +'<br>🗓️ '+(t.date||"")+(t.time?(" · "+t.time):"")+'<br>📍 '+(t.venue||"")+'</div>'
      +'<div class="qrw"><img src="'+qr+'" alt="QR code"></div>'
      +'<div class="cd">'+code+'</div><div class="nt">'+I18N[L].qrNote+'</div>'
      +'</div><div class="ft">Every African Event, One Platform. PlugServices.Ca · tickets.plugservices.ca</div></div>'
      +'<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},250);};</scr'+'ipt></body></html>');
    w.document.close();
  });
}
async function emailTicket(i,btn){
  var t=(D.tickets||[])[i]||{};
  var code=t.code||t.ticket_no||("PLG"+i);
  var orig=btn.textContent;btn.disabled=true;btn.textContent="✉️ "+I18N[L].sending;
  try{
    var r=await fetch(API+"/portal/email-ticket",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:D.email,code:code})});
    var ok=false;try{var j=await r.json();ok=r.ok&&j&&j.ok;}catch(e){}
    btn.textContent=ok?("✉️ "+I18N[L].sentOk):("✉️ "+(r.status===404?I18N[L].soon:I18N[L].sendFail));
    if(!ok){btn.disabled=false;setTimeout(function(){btn.textContent=orig;},4000);}
  }catch(e){btn.textContent="✉️ "+I18N[L].sendFail;btn.disabled=false;setTimeout(function(){btn.textContent=orig;},4000);}
}
async function loadUpcoming(){
  try{
    var r=await fetch("https://tickets.plugservices.ca/wp-json/wp/v2/mep_events?per_page=40&_fields=slug,title,plug_event&nc="+Date.now());
    var list=await r.json();var today=new Date().toISOString().slice(0,10);
    var up=list.filter(function(e){var p=e.plug_event||{};return (p.event_start_date||"")>=today;})
      .sort(function(a,b){return (a.plug_event.event_start_date||"").localeCompare(b.plug_event.event_start_date||"");}).slice(0,6);
    document.getElementById("up").innerHTML=up.map(function(e){var p=e.plug_event||{};
      return '<div class="tik">'+(p.thumb?('<img class="img" src="'+p.thumb+'" alt="" loading="lazy">'):'<div class="img"></div>')
        +'<div class="bd"><div class="ev">'+((e.title&&e.title.rendered)||e.slug)+'</div>'
        +'<div class="meta">🗓️ '+(p.event_start_date||"")+'<br>📍 '+((p.mep_location_venue||"")+(p.mep_city?(", "+p.mep_city):""))+'</div>'
        +'<a class="qr get" href="'+(p.link||"https://plugservices.ca/events.html")+'" target="_blank" rel="noopener">🎟️ '+I18N[L].getTix+'</a></div></div>';}).join("");
  }catch(e){}
}
async function doSub(ev){
  ev.preventDefault();
  var b=document.getElementById("subBtn");b.disabled=true;
  try{
    await fetch(API+"/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("subEmail").value})});
    b.textContent=I18N[L].subDone;
    var se=document.getElementById("subEmail"); if(se) se.style.display="none";
    b.style.cursor="default"; b.onclick=function(){return false;};
  }catch(e){b.disabled=false;}
  return false;
}
function shareRow(t){
  var link=t.event_link||"https://plugservices.ca";
  var u=encodeURIComponent(link);
  var msg=encodeURIComponent((L==="fr"?"Je vais à ":"I am going to ")+(t.event||"this event")+"! 🎉 "+link);
  var I=window.PSICONS;
  return '<a class="shb" title="Facebook" href="https://www.facebook.com/sharer/sharer.php?u='+u+'" target="_blank" rel="noopener">'+I.fb+'</a>'
    +'<a class="shb" title="Messenger (mobile)" href="fb-messenger://share/?link='+u+'">'+I.ms+'</a>'
    +'<a class="shb" title="WhatsApp" href="https://wa.me/?text='+msg+'" target="_blank" rel="noopener">'+I.wa+'</a>'
    +'<a class="shb" title="Telegram" href="https://t.me/share/url?url='+u+'&text='+encodeURIComponent(t.event||"")+'" target="_blank" rel="noopener">'+I.tg+'</a>'
    +'<a class="shb" title="X / Twitter" href="https://twitter.com/intent/tweet?text='+msg+'" target="_blank" rel="noopener">'+I.x+'</a>'
    +'<a class="shb" title="Email" href="mailto:?subject='+encodeURIComponent(t.event||"Event")+'&body='+msg+'">'+I.em+'</a>'
    +'<button class="shb" title="Copy link (Instagram, TikTok, Snapchat)" onclick="copyLink(&quot;'+String(link).replace(/"/g,"")+'&quot;,this)">'+I.ln+'</button>';
}
function copyLink(u,btn){
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){btn.textContent="✅";setTimeout(function(){btn.textContent="🔗";},1600);},function(){prompt("Copy link:",u);});
}
applyLang();
</script>

<script>
/* v60.1: guarantee every visible field is >=16px on phones. A 15px input was
   winning the specificity fight and iOS zooms the whole page below 16px. */
(function(){
  function enforce(){
    if(window.innerWidth>900) return;
    document.querySelectorAll('input,select,textarea').forEach(function(e){
      var t=(e.getAttribute('type')||'').toLowerCase();
      if(t==='checkbox'||t==='radio'||t==='hidden') return;
      if(parseFloat(getComputedStyle(e).fontSize) < 16) e.style.setProperty('font-size','16px','important');
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',enforce);}else{enforce();}
  window.addEventListener('resize',enforce);
  setTimeout(enforce,1200); setTimeout(enforce,3000);
  new MutationObserver(enforce).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

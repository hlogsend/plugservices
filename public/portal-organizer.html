<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizer Portal | PlugServices</title>
<meta name="description" content="Sign in or register to see your ticket sales, guest list, payouts and door check-in.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://tickets.plugservices.ca/wp-content/uploads/2024/04/cropped-PHOTO-2024-04-03-10-37-57_1-270x270.jpg">
<style>
:root{--flame:#F0562E;--grape:#4C2A86;--gold:#F5A623;--ink:#1A1230;--cream:#FFF8F0;--green:#1F9D6B;--muted:#6B6480;--line:#E4D9F5;--accent:#F0562E;--plum:#3A2B5C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
a{color:var(--flame);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
/* ===== main-site header ===== */
.nav{background:#fff;border-bottom:1px solid #eee;position:relative;z-index:20}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:27px;letter-spacing:-.5px;color:var(--flame);flex-shrink:0}
.logo img{width:48px;height:48px;border-radius:11px;object-fit:cover}
.logo b{color:var(--grape)}
.logo .wordmark{white-space:nowrap}
.nav-links{display:flex;flex-wrap:nowrap;white-space:nowrap;gap:20px;font-weight:600;font-size:15px;color:var(--plum)}
.nav-links a{color:inherit}
.nav-links a:hover,.nav-links a.active{color:var(--flame)}
.nav-right{display:flex;align-items:center;gap:12px}
.lang a{font-weight:800;font-size:13px;color:var(--muted);cursor:pointer}
.lang a.on{color:var(--flame)}
.hamb{display:none;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--grape)}
.sob{display:none;background:#fff;color:#B3261E;border:1.5px solid #B3261E;border-radius:10px;padding:8px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.sob:hover{background:#FDECEA}
@media(max-width:900px){
  .hamb{display:block}
  .nav-links{position:absolute;top:100%;left:0;right:0;background:var(--cream);flex-direction:column;gap:0;padding:6px 22px 14px;border-bottom:1px solid var(--line);display:none}
  .nav-links.open{display:flex}
  .nav-links a{padding:13px 2px;border-bottom:1px solid var(--line);font-size:16px}
  .nav-links a:last-child{border-bottom:0}
}
@media(max-width:640px){.logo{font-size:23px;gap:9px}.logo img{width:48px;height:48px}}
/* ===== hero ===== */

.hero p{color:#e2d8ff;margin-top:6px;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 6px 24px rgba(26,18,48,.06)}
.auth{max-width:940px;margin:-34px auto 40px;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 20px}
@media(max-width:820px){.auth{grid-template-columns:1fr}}
.auth h2{font-size:20px;margin-bottom:4px}
.auth p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font:inherit;font-size:15px;background:#fff}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,86,46,.12)}
.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:800;border:0;border-radius:11px;padding:13px 22px;font-size:15px;cursor:pointer;width:100%;margin-top:16px;font-family:inherit}
.btn.grape{background:var(--grape)}
.btn:disabled{opacity:.6}
.sso{display:flex;gap:10px;margin-top:12px}
.sso button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
.sso button:hover{border-color:var(--grape)}
.err{display:none;background:#FDECEA;color:#B3261E;border-radius:10px;padding:10px 13px;font-size:13.5px;margin-top:12px;font-weight:600}
.err.show{display:block}
.ok{display:none;background:#EAF7F1;color:#1F9D6B;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:12px;font-weight:600;line-height:1.5}
.ok.show{display:block}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.dash{display:none;padding:26px 0 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.stat .l{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.stat .v{font-size:21px;font-weight:800;margin-top:3px}
h3.sec{font-size:17px;margin:26px 0 10px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13.5px}
th{background:var(--grape);color:#fff;text-align:left;padding:9px 12px;font-size:12px}
td{padding:9px 12px;border-bottom:1px solid #f0ecf7;vertical-align:middle}
tr:nth-child(even) td{background:#faf8fd}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800}
.pill.in{background:#EAF7F1;color:var(--green)}
.pill.out{background:#FDECEA;color:#B3261E}
.ck{background:var(--green);color:#fff;border:0;border-radius:9px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
.ck:disabled{background:#c8c3d6}
.shr{white-space:nowrap}
.shb{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;margin:0 2px;font-size:15px;cursor:pointer;text-decoration:none;line-height:1}
.shb:hover{border-color:var(--flame)}
.paybox{background:var(--cream);border:1px solid #f0e4d4;border-radius:13px;padding:16px 18px;margin:14px 0;font-size:13.5px;line-height:1.6}
.logout{background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:22px;line-height:1.6}
.spin{display:none;text-align:center;padding:40px;color:var(--muted);font-weight:700}
@media(max-width:640px){.hero h1{font-size:23px}.sob{padding:7px 10px;font-size:12px}.nav-in{gap:8px}}

.hero{background:linear-gradient(135deg,var(--grape),#2c1a52);position:relative;overflow:hidden;color:#fff;padding:40px 0}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 46px)}
.hero .wrap{position:relative}
.hero h1{font-size:32px;letter-spacing:-.6px}
.stat{background:linear-gradient(160deg,#fff,#FBF7FF);border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:0 4px 16px rgba(76,42,134,.07);min-width:0}
/* v67: "CAD 1230.00" must sit on ONE line — fluid size + nowrap, and the
   currency code rendered smaller than the amount so wide values still fit. */
.stat .v{font-size:clamp(15px,1.35vw,21px);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.3px;overflow:hidden}
.stat .v .cur{font-size:.68em;font-weight:900;opacity:.72;margin-right:4px;letter-spacing:.3px;vertical-align:baseline}
@media(max-width:900px){.stat .v{font-size:17px}}
.card{border-radius:18px;box-shadow:0 10px 34px rgba(26,18,48,.09)}
h3.sec{font-size:18px;margin:30px 0 12px;color:var(--grape);letter-spacing:-.2px}
table{box-shadow:0 4px 18px rgba(26,18,48,.05)}
.shb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:9px;margin:0 2px;cursor:pointer;text-decoration:none;vertical-align:middle;transition:.12s}
.shb:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(26,18,48,.14)}
.shb svg{width:16px;height:16px}

/* ===== v60: mobile safety — comfortable gutters, real tap targets, no iOS zoom ===== */
html{overflow-x:clip}
body{overflow-x:clip;max-width:100%}
@media(max-width:900px){
  .wrap,.dash,.login,.auth,.sec,.tix,.subscribe,.card,.panel,.box,.form,.reg,.hero-in,.phead .wrap{
    padding-left:max(20px,env(safe-area-inset-left))!important;
    padding-right:max(20px,env(safe-area-inset-right))!important;
    max-width:100%!important}
  .nav-in{min-width:0;gap:8px}
  .logo{min-width:0;flex-shrink:1;overflow:hidden}
  .logo .wordmark{overflow:hidden;text-overflow:clip;min-width:0}
  .wordmark{font-size:clamp(13px,4.35vw,24px)!important;letter-spacing:-.4px!important}
  .nav-right{min-width:0;flex-shrink:0;gap:6px}
  .hamb{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;flex-shrink:0}
  /* 16px inputs stop iOS zooming the page on focus */
  input,select,textarea{font-size:16px!important}
  input:not([type=checkbox]):not([type=radio]),select,textarea{min-height:48px}
  button,.btn,a.btn{min-height:46px}
  /* EN / FR toggle was 16x14 - unusable. Give it a real hit area. */
  .lang a{display:inline-block;min-width:34px;min-height:34px;line-height:34px;text-align:center}
  table{display:block;overflow-x:auto;max-width:100%}
  pre,code{white-space:pre-wrap;word-break:break-word}
  a{word-break:break-word}
}
@media(max-width:420px){
  .wrap,.dash,.login,.auth,.sec,.tix,.subscribe,.card,.panel,.box,.form,.reg{
    padding-left:20px!important;padding-right:20px!important}
}

/* ===== v60.1: measured follow-ups =====
   1. Cards spanned edge-to-edge (L0) on the portals — padded inside, but with no
      air around them. Inset the card itself so the margin is visible.
   2. A 15px input survived the blanket rule (beaten on specificity), so it is
      enforced in JS below as well. */
@media(max-width:900px){
  .login,.auth,.reg,.dash,.tix,.subscribe{
    margin-left:auto!important;margin-right:auto!important;
    width:calc(100% - 40px)!important;max-width:calc(100% - 40px)!important;box-sizing:border-box}
  .login.card,.auth > .card,.reg > .card{border-radius:16px!important}
}
@media(max-width:420px){
  .login,.auth,.reg,.dash,.tix,.subscribe{
    width:calc(100% - 40px)!important;max-width:calc(100% - 40px)!important}
}

/* v64: Follow-us row — identical to the main site footer */
.psoc{display:grid;grid-template-columns:repeat(3,44px);justify-content:center;gap:14px;margin:0 auto 14px}
.psoc a{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.psoc a svg{width:21px;height:21px;fill:#fff;display:block}
.psoc .fb{background:#1877F2}
.psoc .ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.psoc .wa{background:#25D366}

/* v65: wordmark fits at every width — no half-words in the portal header */
@media(max-width:430px){ .logo img{width:34px!important;height:34px!important} }
@media(max-width:400px){ .wordmark{letter-spacing:-.55px!important} }
@media(max-width:349px){ .logo .wordmark{display:none} .logo img{width:38px!important;height:38px!important} }
</style>

<body>
<header class="nav"><div class="wrap nav-in">

  <nav class="nav-links" id="navLinks">
    <a href='https://plugservices.ca/events'>Find Events</a>
    <a href='https://plugservices.ca/#cats'>Categories</a>
    <a href='https://plugservices.ca/partners'>Partners</a>
    <a href='https://plugservices.ca/submit-event'>Sell Tickets</a>
    <a href='https://plugservices.ca/faq'>FAQ</a>
    <a href='https://plugservices.ca/about'>About</a>
  </nav>
  <div class="nav-right">
    <span class="lang" translate="no"><a data-l="en" class="on" onclick="setLang('en')">EN</a> / <a data-l="fr" onclick="setLang('fr')">FR</a></span>
    <button class="sob" id="signoutBtn" onclick="doLogout()" data-i18n="logout">Sign out</button>
    <button class="hamb" aria-label="Menu" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>

</div></header>
<div class="hero"><div class="wrap">
  <h1>🔑 <span data-i18n="heroTitle"></span></h1>
  <p data-i18n="heroSub"></p>
</div></div>

<div class="auth" id="authBox">
  <div class="card" id="loginBox">
    <h2 data-i18n="signIn"></h2>
    <p class="sub" data-i18n="signInSub"></p>
    <form id="lf" onsubmit="return doLogin(event)">
      <label data-i18n="email"></label><input id="lg" type="text" autocomplete="username" required>
      <label data-i18n="password"></label><input id="pw" type="password" autocomplete="current-password" required>
      <div class="err" id="lerr" data-i18n="badLogin"></div>
      <button class="btn" id="lbtn" type="submit" data-i18n="signInBtn"></button>
    </form>
    <p class="hint" style="margin-top:16px;text-align:center;font-size:15px">
      <a href="#" onclick="return showForgot()" style="color:var(--flame);font-weight:800" data-i18n="forgot"></a><br>
      <span data-i18n="noAcct"></span> <a href="/organizer-register" style="color:var(--grape);font-weight:800" data-i18n="registerLink"></a>
    </p>
    <div id="forgotBox" style="display:none;margin-top:14px;padding:14px;background:#faf8fd;border:1px solid var(--line);border-radius:12px">
      <b data-i18n="forgotTitle"></b>
      <p class="sub" style="margin:6px 0 10px" data-i18n="forgotSub"></p>
      <input id="fEmail" type="email" autocomplete="email" placeholder="you@email.com" style="width:100%">
      <button class="btn" id="fBtn" type="button" onclick="doForgot()" style="margin-top:10px" data-i18n="forgotBtn"></button>
      <p class="hint" id="fOk" style="display:none;color:#1faa53;font-weight:700;margin-top:10px" data-i18n="forgotOk"></p>
    </div>
    <div id="rpBox" style="display:none;margin-top:14px;padding:14px;background:#fff8f0;border:1px solid #F0E4D4;border-radius:12px">
      <b data-i18n="rpTitle"></b>
      <input id="rpPw" type="password" autocomplete="new-password" style="width:100%;margin-top:10px">
      <input id="rpPw2" type="password" autocomplete="new-password" style="width:100%;margin-top:8px">
      <button class="btn" id="rpBtn" type="button" onclick="doReset()" style="margin-top:10px" data-i18n="rpBtn"></button>
      <p class="hint" id="rpMsg" style="display:none;font-weight:700;margin-top:10px"></p>
    </div>
  </div>
  <div class="card" id="regCta" style="text-align:center">
    <h2 data-i18n="newHere"></h2>
    <p class="sub" data-i18n="newHereSub"></p>
    <a class="btn grape" href="/organizer-register" style="display:block;text-decoration:none;text-align:center" data-i18n="goRegister"></a>
    <p class="hint" style="margin-top:14px" data-i18n="regHint"></p>
  </div>
  </div>
</div>
<div class="spin" id="spin">⏳ …</div>
<div class="dash wrap" id="dash">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div><b id="who"></b> · <span id="whoEmail" style="color:var(--muted)"></span></div>
    <span><button class="logout" onclick="openPw()" data-i18n="pw" style="margin-right:14px"></button><button class="logout" onclick="doLogout()" data-i18n="logout"></button></span>
  </div>
  <div class="grid" id="stats"></div>
  <div class="paybox" id="paybox"></div>
  <h3 class="sec" data-i18n="yourEvents"></h3>
  <div style="overflow-x:auto"><table id="evT"></table></div>
  <div id="editBox" class="card" style="display:none;margin-top:14px"></div>
  <div id="pwBox" class="card" style="display:none;margin-top:14px;max-width:430px"></div>
  <h3 class="sec" data-i18n="guests"></h3>
  <input id="gsearch" placeholder="Search name, email or ticket #…" style="max-width:320px;margin-bottom:10px" oninput="renderAtt()">
  <button class="ck" style="background:var(--grape);margin-left:8px" onclick="downloadGuests()" data-i18n="dl">⬇️ Download guest list (Excel)</button>
  <div style="overflow-x:auto"><table id="attT"></table></div>
  <h3 class="sec" data-i18n="sales"></h3>
  <div style="overflow-x:auto"><table id="ordT"></table></div>
  <h3 class="sec" data-i18n="paylog"></h3>
  <div style="overflow-x:auto"><table id="payT"></table></div>
</div>

var L=localStorage.getItem("plang")||"en", D=null;
function setLang(l){L=l;localStorage.setItem("plang",l);applyLang();if(D)render(D);}
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(function(n){var k=n.getAttribute("data-i18n");if(I18N[L][k])n.textContent=I18N[L][k];});
 document.querySelectorAll(".lang a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-l")===L);});}
function money(v){return '<span class="cur">'+(D&&D.currency||"CAD")+"</span>"+Number(v||0).toFixed(2);}
async function me(){try{var r=await fetch(API+"/portal/me?nc="+Date.now(),{credentials:"include"});return await r.json();}catch(e){return{logged_in:false};}}
async function boot(){
  applyLang();
  /* White-label password reset: link from the branded reset email lands here. */
  var q=new URLSearchParams(location.search);
  if(q.get("rp")==="1"&&q.get("login")&&q.get("key")){
    document.getElementById("rpBox").style.display="block";
    window.__rp={login:q.get("login"),key:q.get("key")};
  }
  var m=await me();
  if(m.logged_in&&m.organizer){showDash();}
}
function showForgot(){
  var b=document.getElementById("forgotBox");
  b.style.display=(b.style.display==="none"||!b.style.display)?"block":"none";
  var lg=document.getElementById("lg").value;
  if(lg&&lg.indexOf("@")>0){document.getElementById("fEmail").value=lg;}
  return false;
}
async function doForgot(){
  var em=(document.getElementById("fEmail").value||"").trim();
  if(em.indexOf("@")<1){document.getElementById("fEmail").focus();return;}
  var b=document.getElementById("fBtn");b.disabled=true;
  var branded=false;
  try{
    var r=await fetch(API+"/portal/forgot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em})});
    branded=r.ok;
  }catch(e){}
  if(!branded){
    /* fallback: WordPress native reset email (until the branded endpoint is live) */
    try{
      var fd=new FormData();fd.append("user_login",em);fd.append("wp-submit","Get New Password");
      await fetch("https://tickets.plugservices.ca/wp-login.php?action=lostpassword",{method:"POST",body:fd,mode:"no-cors"});
    }catch(e){}
  }
  document.getElementById("fOk").style.display="block";
  b.disabled=false;
}
async function doReset(){
  var p1=document.getElementById("rpPw").value,p2=document.getElementById("rpPw2").value;
  var msg=document.getElementById("rpMsg");msg.style.display="block";
  if(p1.length<8){msg.style.color="#c0392b";msg.textContent=I18N[L].rpShort;return;}
  if(p1!==p2){msg.style.color="#c0392b";msg.textContent=I18N[L].rpMismatch;return;}
  var b=document.getElementById("rpBtn");b.disabled=true;
  try{
    var r=await fetch(API+"/portal/reset",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({login:window.__rp.login,key:window.__rp.key,password:p1})});
    var j=null;try{j=await r.json();}catch(e){}
    if(r.ok&&j&&j.ok){
      msg.style.color="#1faa53";msg.textContent=I18N[L].rpOk;
      document.getElementById("lg").value=window.__rp.login;
      history.replaceState(null,"",location.pathname);
    } else {
      msg.style.color="#c0392b";msg.textContent=I18N[L].rpExpired;b.disabled=false;
    }
  }catch(e){msg.style.color="#c0392b";msg.textContent=I18N[L].rpExpired;b.disabled=false;}
}
async function doLogin(ev){
  ev.preventDefault();
  var b=document.getElementById("lbtn");b.disabled=true;
  document.getElementById("lerr").classList.remove("show");
  var fd=new FormData();
  fd.append("log",document.getElementById("lg").value);
  fd.append("pwd",document.getElementById("pw").value);
  fd.append("testcookie","1");fd.append("rememberme","forever");
  try{await fetch("https://tickets.plugservices.ca/wp-login.php",{method:"POST",body:fd,mode:"no-cors",credentials:"include"});}catch(e){}
  var m=await me();
  if(m.logged_in&&m.organizer){showDash();}
  else{document.getElementById("lerr").classList.add("show");b.disabled=false;}
  return false;
}
async function doRegister(ev){
  ev.preventDefault();
  var b=document.getElementById("rbtn");b.disabled=true;
  document.getElementById("rerr").classList.remove("show");
  document.getElementById("rok").classList.remove("show");
  try{
    var r=await fetch(API+"/register-organizer",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:document.getElementById("rname").value,org:document.getElementById("rorg").value,
        email:document.getElementById("remail").value,city:document.getElementById("rcity").value,
        website:document.getElementById("rweb").value})});
    var j=await r.json();
    if(j&&j.ok){
      var ok=document.getElementById("rok");
      if(j.existing){ok.textContent=(L==="fr"?"Un compte existe déjà pour ce courriel — vos identifiants vous ont été envoyés précédemment. Écrivez à hello@plugservices.ca pour les réinitialiser.":"An account already exists for this email — your credentials were emailed previously. Write hello@plugservices.ca to reset them.");}
      ok.classList.add("show");
      document.getElementById("rf").reset();
    } else {document.getElementById("rerr").classList.add("show");}
  }catch(e){document.getElementById("rerr").classList.add("show");}
  b.disabled=false;
  return false;
}
async function doLogout(){
  try{await fetch(API+"/portal/logout",{method:"POST",credentials:"include"});}catch(e){}
  try{localStorage.removeItem("porg");}catch(e){}
  location.href=location.pathname+"?out="+Date.now();
}
async function showDash(){
  document.getElementById("authBox").style.display="none";
  document.getElementById("spin").style.display="block";
  try{
    var r=await fetch(API+"/portal/organizer?nc="+Date.now(),{credentials:"include"});
    D=await r.json();
    render(D);
  }catch(e){ document.getElementById("spin").textContent="Could not load your data — refresh to retry."; return; }
  document.getElementById("spin").style.display="none";
  document.getElementById("dash").style.display="block";
  var sb=document.getElementById("signoutBtn"); if(sb)sb.style.display="inline-block";
}
function render(d){
  applyLang();
  document.getElementById("who").textContent=d.name;
  document.getElementById("whoEmail").textContent=d.email;
  var vals=[d.events.length,d.tickets,money(d.gross),money(d.refunds),money(d.paid),money(d.due)];
  var cols=["var(--grape)","var(--flame)","var(--ink)","var(--muted)","var(--green)","var(--flame)"];
  document.getElementById("stats").innerHTML=I18N[L].stats.map(function(lab,i){
    return '<div class="stat"><div class="l">'+lab+'</div><div class="v" style="color:'+cols[i]+'">'+vals[i]+"</div></div>";}).join("");
  document.getElementById("paybox").innerHTML="💰 <b>How you get paid:</b> 0% platform fee · paid within 5 business days after your event · "
    +(d.payout_method?("<b>"+d.payout_method+"</b>"+(d.payout_target?" → "+d.payout_target:"")):"payout method not set — email hello@plugservices.ca")
    +" · refunds follow your event's policy.";
  document.getElementById("evT").innerHTML="<tr><th>Event</th><th>Date</th><th>Sold</th><th>Capacity</th><th>Checked in</th><th>Gross</th><th></th><th>Share my event</th></tr>"
    +d.events.map(function(e){return "<tr><td><b><a href='"+e.link+"' target='_blank'>"+e.title+"</a></b></td><td>"+(e.date||"")+"</td><td><b>"+e.sold+"</b></td><td>"+(e.capacity||"—")+"</td><td>"+e.checked_in+"</td><td>"+money(e.gross)+"</td><td><button class='ck' style='background:var(--grape)' onclick='openEdit("+e.id+")'>"+I18N[L].edit+"</button> <button class='ck' style='background:#B3261E' onclick='delEvent("+e.id+")'>"+I18N[L].del+"</button></td><td class='shr'>"+shareRow(e)+"</td></tr>";}).join("");
  renderAtt();
  renderOrders();
  loadPayments();
  document.getElementById("payT").innerHTML="<tr><th>Date</th><th>Amount</th><th>Reference</th></tr>"
    +((d.payouts&&d.payouts.length)?d.payouts.map(function(p){return "<tr><td>"+(p.date||"")+"</td><td>"+money(p.amount)+"</td><td>"+(p.ref||"")+"</td></tr>";}).join("")
    :"<tr><td colspan='3' style='color:var(--muted)'>No payouts yet — your balance above is what PlugServices owes you.</td></tr>");
}
var PM={};            /* order # -> payment method title */
var PM_EMAIL={};      /* buyer email -> payment method title */
function pmBadge(t){
  if(!t)return "";
  var etr=/interac|transfer|bacs/i.test(t);
  return "<span class='pill' style='background:"+(etr?"#e6f8ec;color:#1a7f42":"#efe9fb;color:#4C2A86")+";font-weight:800'>"+(etr?"💸 e-Transfer":"💳 Card")+"</span>";
}
function renderOrders(){
  if(!D)return;
  document.getElementById("ordT").innerHTML="<tr><th>#</th><th>Date</th><th>Buyer</th><th>Email</th><th>Event</th><th>Qty</th><th>Amount</th><th>Paid by</th></tr>"
    +(D.orders||[]).map(function(o){return "<tr><td>#"+o.no+"</td><td>"+o.date+"</td><td>"+o.buyer+"</td><td>"+o.email+"</td><td>"+o.event+"</td><td>"+o.qty+"</td><td>"+money(o.total)+"</td><td>"+(pmBadge(PM[String(o.no)])||"—")+"</td></tr>";}).join("")||"";
}
async function loadPayments(){
  try{
    var r=await fetch(API+"/portal/payments?nc="+Date.now(),{credentials:"include"});
    if(!r.ok)return;
    var j=await r.json();
    (j.payments||[]).forEach(function(p){PM[String(p.no)]=p.pm;if(p.email)PM_EMAIL[(p.email||"").toLowerCase()]=p.pm;});
    renderOrders();renderAtt();
  }catch(e){}
}
function renderAtt(){
  if(!D)return;
  var q=(document.getElementById("gsearch").value||"").toLowerCase();
  var rows=(D.attendees||[]).filter(function(a){return !q||((a.name||"")+(a.email||"")+(a.event||"")+(a.code||"")).toLowerCase().indexOf(q)>-1;});
  document.getElementById("attT").innerHTML="<tr><th>Guest</th><th>Ticket #</th><th>Email</th><th>Ticket</th><th>Paid by</th><th>Event</th><th>Status</th><th></th></tr>"
    +rows.map(function(a){
      var pm=PM_EMAIL[(a.email||"").toLowerCase()]||"";
      return "<tr><td><b>"+(a.name||"")+"</b></td><td>"+(a.code||"")+"</td><td>"+(a.email||"")+"</td><td>"+(a.type||"")+"</td><td>"+(pmBadge(pm)||"—")+"</td><td>"+(a.event||"")+"</td>"
        +"<td>"+(a.checked_in?"<span class='pill in'>"+I18N[L].checked+"</span>":"<span class='pill out'>—</span>")+"</td>"
        +"<td>"+(a.checked_in?"":"<button class='ck' onclick='checkin("+a.id+",this)'>"+I18N[L].checkin+"</button>")+"</td></tr>";}).join("");
}
async function checkin(id,btn){
  btn.disabled=true;btn.textContent="…";
  try{
    var r=await fetch(API+"/portal/checkin",{method:"POST",credentials:"include",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({attendee_id:id})});
    var j=await r.json();
    if(j.ok){(D.attendees||[]).forEach(function(a){if(a.id===id)a.checked_in=true;});renderAtt();}
    else{btn.textContent="✗";}
  }catch(e){btn.textContent="✗";btn.disabled=false;}
}
function shareRow(e){
  var u=encodeURIComponent(e.link||"");
  var t=encodeURIComponent("Join me at "+(e.title||"my event")+"! Tickets: "+(e.link||""));
  var I=window.PSICONS;
  return '<a class="shb" title="Facebook" href="https://www.facebook.com/sharer/sharer.php?u='+u+'" target="_blank" rel="noopener">'+I.fb+'</a>'
    +'<a class="shb" title="Messenger (mobile)" href="fb-messenger://share/?link='+u+'">'+I.ms+'</a>'
    +'<a class="shb" title="WhatsApp" href="https://wa.me/?text='+t+'" target="_blank" rel="noopener">'+I.wa+'</a>'
    +'<a class="shb" title="Telegram" href="https://t.me/share/url?url='+u+'&text='+encodeURIComponent(e.title||"")+'" target="_blank" rel="noopener">'+I.tg+'</a>'
    +'<a class="shb" title="X / Twitter" href="https://twitter.com/intent/tweet?text='+t+'" target="_blank" rel="noopener">'+I.x+'</a>'
    +'<a class="shb" title="Email" href="mailto:?subject='+encodeURIComponent("Join me at "+(e.title||"my event"))+'&body='+t+'">'+I.em+'</a>'
    +'<button class="shb" title="Copy link (Instagram, TikTok, Snapchat)" onclick="copyLink(\''+String(e.link||"").replace(/'/g,"")+'\',this)">'+I.ln+'</button>';
}
function copyLink(u,btn){
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){btn.textContent="✅";setTimeout(function(){btn.textContent="🔗";},1600);},function(){prompt("Copy your event link:",u);});
}
async function openEdit(id){
  var box=document.getElementById("editBox");
  box.style.display="block"; box.innerHTML="⏳ …"; box.scrollIntoView({behavior:"smooth",block:"center"});
  try{
    var r=await fetch(API+"/portal/event?id="+id+"&nc="+Date.now(),{credentials:"include"});
    var e=await r.json();
    if(!e||!e.id){box.innerHTML="Could not load this event.";return;}
    var tiers=(e.tiers&&e.tiers.length?e.tiers:[{name:"Ticket",price:0,qty:999,sold:0}]);
    box.innerHTML='<h3 style="margin:0 0 4px;color:var(--grape)">'+I18N[L].editTitle+' — '+e.title+'</h3>'
      +'<p class="sub" style="color:var(--muted);font-size:12.5px;margin:0 0 12px">Changes go live immediately on your event page.</p>'
      +'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">'
      +'<div><label>Date</label><input id="ed_date" type="date" value="'+(e.date||"")+'"></div>'
      +'<div><label>Start time</label><input id="ed_time" type="time" value="'+(e.time||"")+'"></div>'
      +'<div><label>End time</label><input id="ed_endt" type="time" value="'+(e.end_time||"")+'"></div>'
      +'<div><label>City</label><input id="ed_city" value="'+(e.city||"")+'"></div>'
      +'<div><label>Venue name</label><input id="ed_venue" value="'+(e.venue||"")+'"></div>'
      +'<div><label>Street address</label><input id="ed_addr" value="'+(e.address||"")+'"></div></div>'
      +'<label>Description</label><textarea id="ed_desc" rows="5" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;font:inherit"></textarea>'
      +'<label style="margin-top:12px">Tickets (sold seats are protected)</label><div id="ed_tiers">'
      +tiers.map(function(t,i){return '<div style="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap">'
        +'<input placeholder="Name" value="'+String(t.name||"").replace(/"/g,"&quot;")+'" data-tf="name" style="flex:2;min-width:120px">'
        +'<input placeholder="Price" type="number" min="0" step="0.01" value="'+(t.price||0)+'" data-tf="price" style="flex:1;min-width:80px">'
        +'<input placeholder="Qty" type="number" min="'+(t.sold||0)+'" value="'+(t.qty||999)+'" data-tf="qty" style="flex:1;min-width:80px">'
        +'<span style="align-self:center;font-size:11.5px;color:var(--muted)">'+(t.sold||0)+' sold</span></div>';}).join("")
      +'</div><button class="ck" style="background:#fff;color:var(--grape);border:1.5px solid var(--line)" onclick="addTierRow()">+ Add ticket type</button>'
      +'<div style="margin-top:14px;display:flex;gap:10px">'
      +'<button class="btn" style="width:auto;margin:0" onclick="saveEdit('+id+')">'+I18N[L].save+'</button>'
      +'<button class="ck" id="ed_cancel" style="background:#fff;color:var(--muted);border:1.5px solid var(--line)">'+I18N[L].cancel+'</button>'
      +'<span id="ed_msg" style="align-self:center;font-weight:700;font-size:13px"></span></div>';
    document.getElementById("ed_desc").value=e.description||"";
    document.getElementById("ed_cancel").onclick=function(){box.style.display="none";};
  }catch(err){box.innerHTML="Could not load this event.";}
}
function addTierRow(){
  var d=document.createElement("div"); d.style.cssText="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap";
  d.innerHTML='<input placeholder="Name" data-tf="name" style="flex:2;min-width:120px"><input placeholder="Price" type="number" min="0" step="0.01" data-tf="price" style="flex:1;min-width:80px"><input placeholder="Qty" type="number" min="1" value="999" data-tf="qty" style="flex:1;min-width:80px"><span style="align-self:center;font-size:11.5px;color:var(--muted)">new</span>';
  document.getElementById("ed_tiers").appendChild(d);
}
async function saveEdit(id){
  var rows=[...document.querySelectorAll("#ed_tiers > div")].map(function(div){
    var g=function(f){var el=div.querySelector("[data-tf="+f+"]");return el?el.value:"";};
    return {name:g("name"),price:parseFloat(g("price"))||0,qty:parseInt(g("qty"))||999};
  }).filter(function(t){return t.name;});
  var body={id:id,date:document.getElementById("ed_date").value,time:document.getElementById("ed_time").value,
    end_time:document.getElementById("ed_endt").value,city:document.getElementById("ed_city").value,
    venue:document.getElementById("ed_venue").value,address:document.getElementById("ed_addr").value,
    description:document.getElementById("ed_desc").value,tiers:rows};
  var m=document.getElementById("ed_msg"); m.textContent="…";
  try{
    var r=await fetch(API+"/portal/update-event",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    var j=await r.json();
    if(j&&j.ok){m.textContent="✓ Saved — live now"; m.style.color="var(--green)"; setTimeout(function(){showDash();},1200);}
    else{m.textContent="✗ "+((j&&j.message)||"failed"); m.style.color="#B3261E";}
  }catch(e2){m.textContent="✗ network error"; m.style.color="#B3261E";}
}
function openPw(){
  var b=document.getElementById("pwBox");
  b.style.display="block"; b.scrollIntoView({behavior:"smooth",block:"center"});
  b.innerHTML='<h3 style="margin:0 0 10px;color:var(--grape)">'+I18N[L].pwTitle+'</h3>'
    +'<label>'+I18N[L].pwCur+'</label><input id="pw_cur" type="password" autocomplete="current-password">'
    +'<label>'+I18N[L].pwNew+'</label><input id="pw_new" type="password" autocomplete="new-password">'
    +'<div style="margin-top:14px;display:flex;gap:10px"><button class="btn" style="width:auto;margin:0" onclick="savePw()">'+I18N[L].pwSave+'</button>'
    +'<button class="ck" style="background:#fff;color:var(--muted);border:1.5px solid var(--line)" onclick="document.getElementById(&quot;pwBox&quot;).style.display=&quot;none&quot;">'+I18N[L].cancel+'</button>'
    +'<span id="pw_msg" style="align-self:center;font-weight:700;font-size:13px"></span></div>';
}
async function savePw(){
  var m=document.getElementById("pw_msg"); m.textContent="…"; m.style.color="var(--muted)";
  try{
    var r=await fetch(API+"/portal/password",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({current:document.getElementById("pw_cur").value,new:document.getElementById("pw_new").value})});
    var j=await r.json();
    if(j&&j.ok){m.textContent=I18N[L].pwDone; m.style.color="var(--green)"; setTimeout(function(){location.href=location.pathname+"?pw="+Date.now();},2200);}
    else{m.textContent="✗ "+((j&&j.message)||"failed"); m.style.color="#B3261E";}
  }catch(e){m.textContent="✗ network error"; m.style.color="#B3261E";}
}
async function delEvent(id){
  if(!confirm(I18N[L].delQ)) return;
  try{
    var r=await fetch(API+"/portal/delete-event",{method:"POST",credentials:"include",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id})});
    var j=await r.json();
    if(j&&j.ok){ alert(I18N[L].delOk); location.reload(); }
    else { alert((j&&j.message)||"Could not delete this event."); }
  }catch(e){ alert("Network error — please try again."); }
}
function downloadGuests(){
  if(!D)return;
  var rows=[["Guest name","Ticket #","Email","Phone","Ticket type","Event","Checked in"]];
  (D.attendees||[]).forEach(function(a){rows.push([a.name||"",a.code||"",a.email||"",a.phone||"",a.type||"",a.event||"",a.checked_in?"YES":"no"]);});
  var csv="\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
  var b=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="plugservices-guest-list-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}
boot();
</script>

<script>
/* v60.1: guarantee every visible field is >=16px on phones. A 15px input was
   winning the specificity fight and iOS zooms the whole page below 16px. */
(function(){
  function enforce(){
    if(window.innerWidth>900) return;
    document.querySelectorAll('input,select,textarea').forEach(function(e){
      var t=(e.getAttribute('type')||'').toLowerCase();
      if(t==='checkbox'||t==='radio'||t==='hidden') return;
      if(parseFloat(getComputedStyle(e).fontSize) < 16) e.style.setProperty('font-size','16px','important');
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',enforce);}else{enforce();}
  window.addEventListener('resize',enforce);
  setTimeout(enforce,1200); setTimeout(enforce,3000);
  new MutationObserver(enforce).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
